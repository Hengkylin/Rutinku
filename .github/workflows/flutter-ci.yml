# CI/CD RutinKu (issue #3, alur branch P11)
#
# Branch:
#   main / v1.0 : rilis yang sudah OK
#   v1.0_dev    : pengembangan (fitur & perbaikan bug) yang sedang diuji
#   v1.1        : rilis berikutnya hasil v1.0_dev
#
# CI : setiap push / pull request ke branch di atas -> flutter analyze +
#      flutter test (ringkasan passed/failed di halaman run), lalu build APK
#      release dan simpan sebagai artifact (14 hari).
#      Jika ADA unit test yang gagal, job Build APK & Deploy TIDAK dijalankan.
# CD : - push ke v1.0_dev yang semua tesnya hijau -> APK otomatis dipasang ke
#        pre-release "dev-latest" (Live, siap diuji tester).
#      - push tag versi (mis. v1.1.0) -> GitHub Release berisi APK.
#
# Proyek Flutter ada di folder rutinku_flutter/, versi Flutter disamakan
# dengan mesin pengembang agar hasil analyze/test identik.
name: Flutter CI/CD

on:
  push:
    branches: [main, 'v1.0', 'v1.0_dev', 'v1.1']
    tags: ['v*']
  pull_request:
    branches: [main, 'v1.0', 'v1.0_dev', 'v1.1']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

defaults:
  run:
    working-directory: rutinku_flutter

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # --machine = reporter JSON (satu event per baris) agar jumlah
      # passed/failed bisa diringkas di langkah berikutnya.
      - name: Run tests
        run: flutter test --machine > test-results.json

      - name: Ringkasan unit test
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          names, passed, failed, skipped, errors = {}, [], [], [], {}
          with open('test-results.json', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      e = json.loads(line)
                  except ValueError:
                      continue
                  t = e.get('type')
                  if t == 'testStart':
                      names[e['test']['id']] = e['test']['name']
                  elif t == 'error':
                      errors.setdefault(e['testID'], e.get('error', ''))
                  elif t == 'testDone' and not e.get('hidden'):
                      name = names.get(e['testID'], str(e['testID']))
                      if e.get('skipped'):
                          skipped.append(name)
                      elif e.get('result') == 'success':
                          passed.append(name)
                      else:
                          failed.append((name, errors.get(e['testID'], '')))

          total = len(passed) + len(failed) + len(skipped)
          status = 'SEMUA HIJAU' if not failed else 'ADA YANG GAGAL'
          lines = [
              f'## Unit test: {status}',
              '',
              '| Total | Passed | Failed | Skipped |',
              '|---:|---:|---:|---:|',
              f'| {total} | {len(passed)} | {len(failed)} | {len(skipped)} |',
          ]
          if failed:
              lines += ['', '### Tes yang gagal', '']
              for name, err in failed:
                  first = (err.strip().splitlines() or [''])[0][:300]
                  lines.append(f'- **{name}**  \n  `{first}`')
              lines += ['', 'Build APK & deploy **dibatalkan** karena ada tes yang gagal.']
          text = '\n'.join(lines)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(text + '\n')
          for name, err in failed:
              print(f'::error title=Unit test gagal::{name}')
          PY

      - name: Upload hasil test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: rutinku_flutter/test-results.json
          retention-days: 14

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache ~/.gradle (dependensi & wrapper) agar tidak mengunduh ulang
      # dari Maven Central setiap run (menghindari error 429 Too Many Requests).
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Maven Central kadang membalas 429 (rate limit) ke runner GitHub;
      # coba ulang sampai 3 kali dengan jeda yang makin lama.
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build gagal (percobaan $attempt), coba lagi dalam $((attempt * 60)) detik..."
              sleep $((attempt * 60))
            fi
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutinku-apk-${{ github.sha }}
          path: rutinku_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rutinku-apk-${{ github.sha }}

      - name: Rename APK
        working-directory: .
        run: mv app-release.apk "RutinKu-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: RutinKu-${{ github.ref_name }}.apk
          generate_release_notes: true
          # Tag berisi tanda "-" (mis. v1.0.0-rc.2) ditandai pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Deploy "Live" untuk branch pengembangan: setiap push ke v1.0_dev yang
  # lolos semua tes & build memperbarui pre-release "dev-latest".
  deploy-dev:
    name: Deploy Live (dev-latest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.0_dev'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rutinku-apk-${{ github.sha }}

      - name: Publish ke pre-release dev-latest
        run: |
          mv app-release.apk RutinKu-dev-latest.apk
          SHORT_SHA="${GITHUB_SHA::7}"
          NOW="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest RutinKu-dev-latest.apk \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "RutinKu dev-latest (v1.0_dev @ $SHORT_SHA)" \
            --notes "Build otomatis dari branch **v1.0_dev** (commit $SHORT_SHA, $NOW).

          Semua unit test lulus, APK siap diuji tester. Jangan dipakai sebagai rilis final.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "## Deploy Live: dev-latest diperbarui ke commit $SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
